<div class="bw-workbar"><button class="bw-mobile-back" id="bw-mobile-back" aria-label="Show conversation"><i data-lucide="message-circle" aria-hidden="true"></i></button><nav class="bw-tabs" id="bw-tabs" aria-label="Chat workspace tabs"></nav><button class="bw-icon-button" id="bw-plus" aria-label="Open new work tab" aria-expanded="false"><i data-lucide="plus" aria-hidden="true"></i></button><button class="bw-icon-button" id="bw-pins" aria-label="Saved workspace pins" aria-expanded="false"><i data-lucide="pin" aria-hidden="true"></i><span class="bw-pins-label">Pins</span></button></div>
<aside class="bw-sidebar" aria-label="Documents and chats"><div class="bw-label">Documents</div><button class="bw-nav" data-direct="overview"><i data-lucide="file-text" aria-hidden="true"></i><span>Overview</span></button><button class="bw-nav" data-direct="notes"><i data-lucide="file-text" aria-hidden="true"></i><span>Interaction notes</span></button><div class="bw-label" style="margin-top:22px">Recent chats</div><nav id="bw-recent-chats" aria-label="Recent chats"></nav><div class="bw-account"><span class="bw-avatar">FJ</span><span>Frikk Jarl</span><span class="bw-spacer"></span><span class="bw-muted">Concept</span></div></aside>
<section class="bw-chat" aria-label="Main conversation"><div class="bw-transcript" id="bw-transcript"></div><form class="bw-composer" id="bw-compose"><textarea id="bw-prompt" aria-label="Message the assistant" placeholder="Ask, create, or change something…"></textarea><div class="bw-compose-foot"><button type="button" class="bw-folder-chip" id="bw-folder-context" aria-label="Agent working folder" data-project-menu aria-expanded="false"><i data-lucide="folder-open" aria-hidden="true"></i><span id="bw-folder-label">barkpark</span><i data-lucide="chevron-down" aria-hidden="true"></i></button><span class="bw-spacer"></span><button class="bw-send" aria-label="Send message">↑</button></div></form></section>
<section class="bw-workspace" id="bw-workspace" aria-label="Active work tab"></section>
<div class="bw-menu" id="bw-new-menu" hidden><h3>Open in this workspace</h3><button data-new="project"><i data-lucide="folder-code" aria-hidden="true"></i>Project editor</button><button data-new="chat"><i data-lucide="message-circle" aria-hidden="true"></i>New chat</button><button data-new="web"><i data-lucide="globe" aria-hidden="true"></i>Website</button><button data-new="doc"><i data-lucide="file-text" aria-hidden="true"></i>Document</button><button data-new="review"><i data-lucide="git-pull-request" aria-hidden="true"></i>Code review</button></div>
<div class="bw-menu" id="bw-pin-menu" hidden></div><div class="bw-menu" id="bw-project-menu" hidden></div>
<script>
(()=>{
const root=document.getElementById('bd-worktabs'),q=s=>root.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let serial=4,current='launch',mode='chat',pins=[],pinId=0;
const docs={overview:{title:'Overview',lead:'A place for your documents, conversations, and the work happening between them.',body:'Keep the conversation beside the work. Open a document, explore a website, or review a change without leaving the chat.',tail:'Everything you make remains connected to its sources in Barkpark.',proposal:false,accepted:false,edited:false},notes:{title:'Interaction notes',lead:'Different kinds of work. One familiar place to follow them.',body:'Each chat owns a workspace of tabs. A tab can hold a document, a website, a code review, or another conversation.',tail:'When you choose a tab yourself, keep it in view. The assistant can continue working without moving you away.',proposal:false,accepted:false,edited:false}};
const newTab=(type,extra={})=>({id:++serial,type,projectId:contexts[current]?.projectId||'barkpark',folder:contexts[current]?.folder||'',path:type==='doc'?['overview']:[],title:type==='project'?'Project':type==='web'?'barkpark.cloud':type==='review'?'Review':type==='chat'?'New chat':'Overview',url:'https://barkpark.cloud',scroll:0,unread:false,...extra});
const contexts={launch:{title:'Shaping Barkdown',prompt:'Refine the overview, look at the website, and show me the change to the workspace tabs.',tabs:[{id:1,type:'doc',title:'Overview',path:['overview'],scroll:0},{id:2,type:'web',title:'barkpark.cloud',url:'https://barkpark.cloud',scroll:0},{id:3,type:'review',title:'Review',scroll:0}],active:3,events:[],messages:[],following:true,running:false,chatScroll:0,closed:new Set()},research:{title:'Explore the content graph',prompt:'Show me how documents stay connected to their sources.',tabs:[{id:4,type:'doc',title:'Interaction notes',path:['notes'],scroll:0}],active:4,events:[],messages:[],following:true,running:false,chatScroll:0,closed:new Set()},direct:{title:'Documents',tabs:[],active:null,events:[],messages:[],chatScroll:0,following:false,closed:new Set()}};
const sideMessages=new Map(),sideDrafts=new Map(),reviewed=new Set(),typeIcon={doc:'file-text',web:'globe',review:'git-pull-request',chat:'message-circle'};
const ctx=()=>contexts[current],active=()=>ctx().tabs.find(t=>t.id===ctx().active),icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});};
function savePosition(){const t=active();if(t){t.scroll=q('#bw-workspace').scrollTop;if(t.type==='chat'&&q('#bw-side-input'))sideDrafts.set(t.id,q('#bw-side-input').value);}ctx().chatScroll=q('#bw-transcript').scrollTop;}
function pauseFollow(){ctx().following=false;}
function renderTabs(){q('#bw-tabs').innerHTML=ctx().tabs.map(t=>`<div class="bw-tab ${t.id===ctx().active?'active':''}"><button data-tab="${t.id}" aria-current="${t.id===ctx().active?'page':'false'}"><i data-lucide="${typeIcon[t.type]}" aria-hidden="true"></i><span class="bw-tab-label">${esc(t.title)}</span>${t.unread?'<span class="bw-dot" aria-label="Updated by the assistant"></span>':''}</button><div class="bw-tab-actions"><button data-pin="${t.id}" aria-label="Pin ${esc(t.title)}"><i data-lucide="pin" aria-hidden="true"></i></button><button data-close="${t.id}" aria-label="Close ${esc(t.title)}"><i data-lucide="x" aria-hidden="true"></i></button></div></div>`).join('');icons();requestAnimationFrame(()=>{const button=q(`[data-tab="${ctx().active}"]`);if(button){const outer=q('#bw-tabs').getBoundingClientRect(),inner=button.getBoundingClientRect();if(inner.right>outer.right)q('#bw-tabs').scrollLeft+=inner.right-outer.right;else if(inner.left<outer.left)q('#bw-tabs').scrollLeft-=outer.left-inner.left;}});}
function renderChat(){const c=ctx();q('#bw-transcript').innerHTML=`<div class="bw-byline"><span class="bw-avatar">FJ</span>You</div><div class="bw-user-message">${esc(c.prompt||'Open a document and begin writing.')}</div><div class="bw-byline"><span class="bw-avatar bw-agent">b</span>Barkdown</div><p class="bw-agent-copy">${current==='research'?'I’ll keep the source material close. Open the interaction notes to explore the idea.':'I’ve opened the overview, website, and code review beside our conversation. You can move between them while I work.'}</p><button class="bw-artifact" data-open="doc"><i data-lucide="file-text" aria-hidden="true"></i><span><strong>Overview</strong><small>Document · editable</small></span><span class="bw-spacer"></span><i data-lucide="panel-right-open" aria-hidden="true"></i></button><button class="bw-artifact" data-open="review"><i data-lucide="git-pull-request" aria-hidden="true"></i><span><strong>Workspace tab changes</strong><small>Code review · example</small></span><span class="bw-spacer"></span><i data-lucide="panel-right-open" aria-hidden="true"></i></button><div>${c.events.map((e,i)=>`<button class="bw-event" data-event="${i}"><i data-lucide="${typeIcon[e.type]}" aria-hidden="true"></i><span>${esc(e.label)}<small>${esc(e.detail)}</small></span></button>`).join('')}</div>${c.messages.map(m=>`<div class="${m.user?'bw-user-message':'bw-agent-copy'}">${esc(m.text)}</div>`).join('')}<button class="bw-demo-action" id="bw-watch" ${c.running?'disabled':''}>${c.running?'Demo running…':c.events.length?'Replay AI walkthrough':'Watch AI work'}</button>${!c.following&&c.events.length?'<button class="bw-follow-action" id="bw-latest">Go to latest activity</button>':''}<p class="bw-small bw-muted">Scripted concept · changes stay in this session</p>`;icons();q('#bw-transcript').scrollTop=c.chatScroll;}
function documentMarkup(t){const id=t.path.at(-1),d=docs[id],source=t.path.length>1?docs[t.path.at(-2)]:null;return `${t.path.length>1?`<div class="bw-path">${t.path.map((key,i)=>`<button data-path="${i}">${esc(docs[key].title)}</button>${i<t.path.length-1?' / ':''}`).join('')}</div>`:''}<div class="bw-docpanes">${source?`<div class="bw-source-pane"><div class="bw-kicker">Source document</div><h2>${esc(source.title)}</h2><p>${esc(source.body)}</p></div>`:''}<div class="bw-current-pane"><article class="bw-document"><div class="bw-kicker">Barkdown / Product notes</div><h1 contenteditable="true" data-field="title" data-doc="${id}" aria-label="Document title">${esc(d.title)}</h1><div class="bw-lead" contenteditable="true" data-field="lead" data-doc="${id}" aria-label="Document introduction">${esc(d.lead)}</div><h2>Keep the work in view</h2><p contenteditable="true" data-field="body" data-doc="${id}" aria-label="Document paragraph">${esc(d.body)}</p>${d.proposal&&!d.accepted?`<div class="bw-proposal"><small>Barkdown · proposed paragraph</small><p>${esc(d.edited?'Your writing is preserved. This proposed addition is separate from your edits.':'Open documents, websites, and code reviews as tabs beside the conversation. Follow the work as it happens, and take over whenever you want.')}</p><button data-keep="${id}">Keep change</button><button data-discard="${id}">Discard</button></div>`:''}<h2>Connected through Barkpark</h2><p contenteditable="true" data-field="tail" data-doc="${id}" aria-label="Document closing paragraph">${esc(d.tail)}</p><div class="bw-doc-links"><span class="bw-small bw-muted">Linked document</span><button data-related="${id==='overview'?'notes':'overview'}"><i data-lucide="file-text" aria-hidden="true"></i>${id==='overview'?'Interaction notes':'Overview'}<span class="bw-spacer"></span>→</button></div><div class="bw-doc-state">${d.accepted?'Change kept · preview session':d.edited?'Your edits are kept in this preview session':'Editable concept · PortableDoc in the production app'}</div></article></div></div>`;}
function reviewMarkup(t){return `<div class="bw-reviewbar"><span>Example change</span><span class="bw-positive">+7</span><span style="color:var(--bw-delete)">−1</span><button data-reviewed="${t.id}">${reviewed.has(t.id)?'Reviewed ✓':'Mark reviewed'}</button></div><div class="bw-review-body"><div class="bw-file-label"><i data-lucide="file-code" aria-hidden="true"></i>workspace / navigation.ts</div><div class="bw-code"><div><span class="ln">12</span><span class="src">type WorkspaceTab =</span></div><div class="del"><span class="ln">−</span><span class="src">  { kind: 'document'; path: Path };</span></div><div class="add"><span class="ln">+</span><span class="src">  | DocumentTab</span></div><div class="add"><span class="ln">+</span><span class="src">  | WebsiteTab</span></div><div class="add"><span class="ln">+</span><span class="src">  | ReviewTab</span></div><div class="add"><span class="ln">+</span><span class="src">  | ConversationTab;</span></div><div><span class="ln">18</span><span class="src"> </span></div><div><span class="ln">19</span><span class="src">function openFromRun(target) {</span></div><div class="add"><span class="ln">+</span><span class="src">  const tab = workspace.open(target);</span></div><div class="add"><span class="ln">+</span><span class="src">  if (workspace.following)</span></div><div class="add"><span class="ln">+</span><span class="src">    workspace.focus(tab);</span></div><div><span class="ln">23</span><span class="src">}</span></div></div><p class="bw-review-note">Documents, websites, reviews, and side chats share the tab strip. Choosing a tab yourself pauses automatic switching.</p><button class="bw-artifact" data-open="doc"><i data-lucide="file-text" aria-hidden="true"></i><span><strong>See the product notes</strong><small>Open the document tab</small></span><span class="bw-spacer"></span>↗</button><p class="bw-small bw-muted">Illustrative code · no repository changes</p></div>`;}
function websiteMarkup(t){return `<form class="bw-browserbar" id="bw-address-form"><i data-lucide="globe" aria-hidden="true"></i><input id="bw-address" aria-label="Website address" value="${esc(t.url)}"><span class="bw-preview-label">Preview</span></form><div class="bw-error" id="bw-web-error" role="status" hidden></div><article class="bw-website"><div class="bw-web-logo"><span class="bw-mark">b</span>Barkpark</div><div class="bw-web-hero"><div class="bw-kicker">Your content, connected</div><h1>Ideas grow better<br>with context.</h1><p>Bring documents, media, and relationships into the same place. Build on content you can inspect, edit, and reuse.</p><div class="bw-web-chips"><span>Documents</span><span>Media</span><span>Relationships</span><span>Search</span></div></div><button class="bw-web-link" data-open="doc">Open the related document <i data-lucide="arrow-up-right" aria-hidden="true"></i></button><p class="bw-small bw-muted">Local website illustration. Addresses are not loaded in this concept.</p></article>`;}
function sideChatMarkup(t){const messages=sideMessages.get(t.id)||[];return `<div class="bw-side-chat"><div><div class="bw-kicker">Side conversation</div><h1>Think this through.</h1><p class="bw-small bw-muted">A separate conversation beside your main chat.</p><div class="bw-bound-context"><i data-lucide="folder-open" aria-hidden="true"></i>${esc(project.folder+(t.folder?' / '+t.folder:''))}</div></div><div class="bw-side-messages">${messages.length?messages.map(m=>`<div class="${m.user?'question':'reply'}">${esc(m.text)}</div>`).join(''):'<p>Explore an idea here while keeping the main conversation in place.</p>'}</div><form class="bw-side-compose" id="bw-side-form"><textarea id="bw-side-input" aria-label="Message side chat" placeholder="Ask a follow-up…" required>${esc(sideDrafts.get(t.id)||'')}</textarea><button>Send to side chat ↑</button></form><span class="bw-small bw-muted">Scripted replies · preview session</span></div>`;}
function renderWork(){const t=active();q('#bw-workspace').innerHTML=!t?'<div class="bw-empty"><span>Open something beside the conversation.</span><button data-show-new>New work tab +</button></div>':t.type==='doc'?documentMarkup(t):t.type==='review'?reviewMarkup(t):t.type==='web'?websiteMarkup(t):t.type==='project'?projectMarkup(t):sideChatMarkup(t);icons();q('#bw-workspace').scrollTop=t?.scroll||0;}
function render(){root.classList.toggle('document-mode',mode==='document');q('#bw-chat-title').textContent=ctx().title;root.querySelectorAll('[data-context]').forEach(b=>b.classList.toggle('selected',b.dataset.context===current));renderTabs();renderChat();renderWork();}
function hideMenus(){q('#bw-new-menu').hidden=true;q('#bw-pin-menu').hidden=true;q('#bw-plus').setAttribute('aria-expanded','false');q('#bw-pins').setAttribute('aria-expanded','false');}
function focusTab(id,manual=true){savePosition();if(manual)pauseFollow();ctx().active=id;const t=active();if(t)t.unread=false;root.classList.remove('mobile-chat');hideMenus();render();}
function openTab(type,forceNew=false){savePosition();pauseFollow();let t=forceNew?null:ctx().tabs.find(t=>t.type===type);if(!t){t=newTab(type);ctx().tabs.push(t);}focusTab(t.id);return t;}
function renderPins(){q('#bw-pin-menu').innerHTML='<h3>Saved workspaces · preview session</h3>'+(pins.length?pins.map(p=>`<div class="bw-pin-row"><button data-restore="${p.id}">${esc(p.label)}<small>${esc(p.rootTitle)} · ${p.tabs.map(t=>esc(t.type==='doc'?t.path.map(id=>docs[id].title).join(' → '):t.title)).join(' / ')}</small></button><button data-unpin="${p.id}" aria-label="Remove pin ${esc(p.label)}">×</button></div>`).join(''):'<p class="bw-small bw-muted" style="padding:4px 9px">Pin a tab to save the entire workspace and the path inside it.</p>');}
function addPin(id){savePosition();const t=ctx().tabs.find(t=>t.id===id);pins.push({id:++pinId,label:t.title,rootTitle:ctx().title,context:current,projectId:ctx().projectId,folder:ctx().folder,editorExpanded:ctx().editorExpanded,mode,tabs:structuredClone(ctx().tabs),active:id,chatScroll:ctx().chatScroll});hideMenus();renderPins();q('#bw-pin-menu').hidden=false;q('#bw-pins').setAttribute('aria-expanded','true');}
function runDemo(){const c=ctx();if(c.running)return;c.running=true;c.following=true;c.events=[];c.closed.clear();const owner=current;const steps=[{type:'web',label:'Opened the website',detail:'Reading the visual direction'},{type:'doc',label:'Proposed a change to Overview',detail:'The paragraph is ready to review'},{type:'review',label:'Opened the code review',detail:'Reviewing how workspace tabs open'},{type:'project',label:'Opened a project file',detail:project.folder+' / '+(Object.keys(exampleFiles).find(f=>!c.folder||f.startsWith(c.folder+'/'))||exampleFile),file:Object.keys(exampleFiles).find(f=>!c.folder||f.startsWith(c.folder+'/'))||exampleFile}];let n=0;function step(){if(n>=steps.length){c.running=false;if(current===owner)renderChat();return;}const event=steps[n++],previousActive=c.active;let t=c.tabs.find(t=>t.type===event.type&&(event.type!=='doc'||t.path.at(-1)==='overview'));if(!t&&!c.closed.has(event.type)){t=newTab(event.type,{projectId:c.projectId,folder:c.folder});c.tabs.push(t);}if(event.type==='project'&&t){t.file=event.file;t.title=event.file.split('/').at(-1);t.treeOpen=false;}if(event.type==='doc')docs.overview.proposal=true;c.events.push({...event,tabId:t?.id});if(t){t.unread=true;if(c.following&&current===owner){savePosition();c.active=t.id;t.unread=false;root.classList.remove('mobile-chat');}}if(current===owner){renderTabs();renderChat();const editing=root.contains(document.activeElement)&&document.activeElement.matches('[contenteditable],textarea,input');if(!editing&&(previousActive!==c.active||t?.id===c.active))renderWork();}setTimeout(step,1500);}step();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.tab){focusTab(Number(d.tab));return;}if(d.close){savePosition();pauseFollow();const index=ctx().tabs.findIndex(t=>t.id===Number(d.close)),removed=ctx().tabs.splice(index,1)[0];ctx().closed.add(removed.type);if(ctx().active===removed.id)ctx().active=ctx().tabs[Math.min(index,ctx().tabs.length-1)]?.id||null;render();return;}if(d.pin){addPin(Number(d.pin));return;}if(d.new){openTab(d.new,true);return;}if(d.open){openTab(d.open);return;}if(d.context){savePosition();pauseFollow();current=d.context;mode='chat';hideMenus();root.classList.remove('mobile-chat');render();return;}if(d.direct){savePosition();pauseFollow();current='direct';mode='document';const t=newTab('doc',{title:docs[d.direct].title,path:[d.direct]});ctx().tabs=[t];ctx().active=t.id;hideMenus();root.classList.remove('mobile-chat');render();return;}if(d.related){savePosition();pauseFollow();active().path.push(d.related);active().title=docs[d.related].title;active().scroll=0;renderTabs();renderWork();return;}if(d.path!==undefined){savePosition();pauseFollow();active().path=active().path.slice(0,Number(d.path)+1);active().title=docs[active().path.at(-1)].title;active().scroll=0;renderTabs();renderWork();return;}if(d.reviewed){reviewed.add(Number(d.reviewed));renderWork();return;}if(d.keep){const doc=docs[d.keep];doc.body+=' Open documents, websites, and code reviews as tabs beside the conversation.';doc.accepted=true;doc.proposal=false;renderWork();return;}if(d.discard){docs[d.discard].proposal=false;renderWork();return;}if(d.restore){savePosition();pauseFollow();const pin=pins.find(p=>p.id===Number(d.restore));current=pin.context;mode=pin.mode;ctx().projectId=pin.projectId;ctx().folder=pin.folder;ctx().editorExpanded=pin.editorExpanded;ctx().tabs=structuredClone(pin.tabs);ctx().active=pin.active;ctx().chatScroll=pin.chatScroll;ctx().following=false;hideMenus();root.classList.remove('mobile-chat');render();return;}if(d.unpin){pins=pins.filter(p=>p.id!==Number(d.unpin));renderPins();return;}if(d.event!==undefined){const event=ctx().events[Number(d.event)];const t=ctx().tabs.find(t=>t.id===event.tabId);if(t)focusTab(t.id);else openTab(event.type);return;}if(b.id==='bw-watch'){runDemo();return;}if(b.id==='bw-latest'){const last=ctx().events.at(-1);if(last){let t=ctx().tabs.find(t=>t.id===last.tabId)||openTab(last.type);focusTab(t.id,false);ctx().following=true;renderChat();}return;}if(b.hasAttribute('data-show-new'))q('#bw-plus').click();});
q('#bw-plus').onclick=()=>{const open=q('#bw-new-menu').hidden;hideMenus();q('#bw-new-menu').hidden=!open;q('#bw-plus').setAttribute('aria-expanded',String(open));};q('#bw-pins').onclick=()=>{const open=q('#bw-pin-menu').hidden;hideMenus();renderPins();q('#bw-pin-menu').hidden=!open;q('#bw-pins').setAttribute('aria-expanded',String(open));};
q('#bw-mobile-back').onclick=()=>{pauseFollow();if(mode==='document'){current='launch';mode='chat';render();}root.classList.toggle('mobile-chat');};q('#bw-go-chat').onclick=()=>{pauseFollow();root.classList.add('mobile-chat');q('#bw-prompt').focus();};
root.addEventListener('input',e=>{if(e.target.dataset.field){pauseFollow();const doc=docs[e.target.dataset.doc];doc[e.target.dataset.field]=e.target.innerText;doc.edited=true;const state=q('.bw-doc-state');if(state)state.textContent='Your edits are kept in this preview session';if(e.target.dataset.field==='title'){ctx().tabs.filter(t=>t.type==='doc'&&t.path.at(-1)===e.target.dataset.doc).forEach(t=>t.title=doc.title||'Untitled');renderTabs();}}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='bw-compose'){const value=q('#bw-prompt').value.trim();if(!value)return;ctx().messages.push({user:true,text:value});q('#bw-prompt').value='';if(/file|folder|project|\.css/i.test(value))openProject(false);else if(/web|site|browse/i.test(value))openTab('web');else if(/review|code/i.test(value))openTab('review');else if(/new chat|side chat/i.test(value))openTab('chat',true);else openTab('doc');ctx().messages.push({text:'Opened in '+contextLabel()+'. This concept uses scripted actions and editable example files; no files on disk are changed.'});ctx().chatScroll=99999;renderChat();}else if(e.target.id==='bw-side-form'){const value=q('#bw-side-input').value.trim();if(!value)return;const t=active(),messages=sideMessages.get(t.id)||[];messages.push({user:true,text:value},{text:'The agent in this side chat works in '+project.folder+(t.folder?' / '+t.folder:'')+'. For this concept, I’d keep the main conversation in place and explore this question here. Each chat keeps its own workspace, and manual navigation pauses automatic tab switching.'});sideMessages.set(t.id,messages);sideDrafts.delete(t.id);t.title=value.length>22?value.slice(0,22)+'…':value;renderTabs();renderWork();}else if(e.target.id==='bw-address-form'){const value=q('#bw-address').value.trim();try{const url=new URL(value.includes('://')?value:'https://'+value);if(!['http:','https:'].includes(url.protocol))throw Error();active().url=url.href;active().title=url.hostname;pauseFollow();renderTabs();renderWork();}catch{q('#bw-web-error').hidden=false;q('#bw-web-error').textContent='Enter a valid http or https website address.';}}});
root.addEventListener('keydown',e=>{if(e.key==='Escape')hideMenus();});root.addEventListener('pointerdown',e=>{if(!e.target.closest('.bw-menu')&&!e.target.closest('#bw-plus')&&!e.target.closest('#bw-pins')&&!e.target.closest('[data-pin]')&&!e.target.closest('[data-project-menu]'))hideMenus();if(e.target.closest('[contenteditable]'))pauseFollow();});
const project={id:'barkpark',name:'Barkpark',folder:'barkpark',root:'/projects/barkpark'};
const exampleFiles={
 'apps/hundesteder/app/globals.css':'/* Example file for the editor concept */\n\n:root {\n  --page-background: #191b18;\n  --page-text: #e7ebdf;\n  --content-width: 72rem;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  background: var(--page-background);\n  color: var(--page-text);\n}\n\n.page {\n  max-width: var(--content-width);\n  margin-inline: auto;\n  padding: 2rem;\n}\n',
 'apps/hundesteder/app/page.tsx':'// Illustrative project file\nexport default function HomePage() {\n  return (\n    <main className="page">\n      <h1>Find your next walk.</h1>\n      <p>Places worth exploring together.</p>\n    </main>\n  );\n}\n',
 'apps/hundesteder/components/Header.tsx':'// Illustrative project file\nexport function Header() {\n  return <header>Hundesteder</header>;\n}\n',
 'api/assets/paper-editor/src/index.js':'// Illustrative project file\n// Barkpark Paper editor integration\nexport const editorSurface = {\n  format: "PortableDoc",\n  host: "Barkdown",\n};\n',
 'README.md':'# Barkpark\n\nExample project workspace for this concept.\n\nDocuments, code, conversations, and media\nretain their own identities and histories.\n'
};
const fileState=new Map(Object.entries(exampleFiles).map(([file,text])=>[file,{draft:text,saved:text,selection:0,scroll:0}]));
const exampleFile=Object.keys(exampleFiles)[0];
let folderChatSerial=0;
Object.values(contexts).forEach(c=>Object.assign(c,{projectId:project.id,folder:'',draft:'',editorExpanded:false}));
contexts.research.folder='api/assets/paper-editor';
const initialProjectTab=newTab('project',{title:'Project',projectId:project.id,file:exampleFile,treeOpen:false});
contexts.launch.tabs.push(initialProjectTab);contexts.launch.active=1;
typeIcon.project='folder-code';

function folderOf(file){return file.includes('/')?file.slice(0,file.lastIndexOf('/')):'';}
function contextLabel(c=ctx()){return project.folder+(c.folder?' / '+c.folder:'');}
function treeMarkup(t){const tree={};Object.keys(exampleFiles).forEach(file=>{let level=tree;const parts=file.split('/');parts.forEach((part,index)=>{if(index===parts.length-1)level[part]={file};else level=level[part]||(level[part]={});});});function branch(node){return Object.entries(node).map(([label,value])=>value.file?`<button class="bw-tree-file ${t.file===value.file?'selected':''}" data-project-file="${esc(value.file)}"><i data-lucide="${value.file.endsWith('.md')?'file-text':'file-code'}" aria-hidden="true"></i><span>${esc(label)}</span>${fileState.get(value.file).draft!==fileState.get(value.file).saved?'<span class="bw-dot" aria-label="Unstored demo edit"></span>':''}</button>`:`<details open><summary>${esc(label)}</summary>${branch(value)}</details>`).join('');}return branch(tree);}
function projectMarkup(t){t.file=t.file&&fileState.has(t.file)?t.file:exampleFile;const file=fileState.get(t.file),folder=folderOf(t.file),dirty=file.draft!==file.saved;return `<div class="bw-project-editor"><div class="bw-editor-head"><span class="bw-file-path">${esc(project.folder+' / '+t.file)}</span><button data-tree-toggle aria-expanded="${!!t.treeOpen}"><i data-lucide="files" aria-hidden="true"></i>Files</button><button data-editor-expand><i data-lucide="${ctx().editorExpanded?'panel-left-open':'expand'}" aria-hidden="true"></i>${ctx().editorExpanded?'Back to chat':'Expand editor'}</button></div><div class="bw-editor-body"><div class="bw-source-editor"><textarea class="bw-source-input" id="bw-source-input" aria-label="Edit ${esc(t.file)}" spellcheck="false" wrap="off">${esc(file.draft)}</textarea></div><aside class="bw-file-tree" aria-label="Project file explorer" ${t.treeOpen?'':'hidden'}><header><i data-lucide="folder-open" aria-hidden="true"></i>${esc(project.folder)}<span class="bw-spacer"></span><button data-tree-toggle aria-label="Close file explorer">×</button></header>${treeMarkup(t)}</aside></div><div class="bw-project-chat-action"><button data-chat-folder="${esc(folder)}"><i data-lucide="message-circle-plus" aria-hidden="true"></i>New chat in this folder</button><span>${esc(folder||'Project root')}</span></div><footer class="bw-editor-footer"><span id="bw-file-status" role="status">${dirty?'Edited · not stored in demo':'Example files · session only'}</span><span class="bw-spacer"></span><button data-store-file>Store in demo</button></footer></div>`;}
function projectMenu(){q('#bw-project-menu').innerHTML=`<h3>Agent working folder</h3><div class="bw-project-location"><b>${esc(project.name)}</b>${esc(project.root)}${ctx().folder?'/'+esc(ctx().folder):''}</div><button data-project-open><i data-lucide="folder-code" aria-hidden="true"></i>Open project in editor</button><button data-chat-folder="${esc(ctx().folder)}"><i data-lucide="message-circle-plus" aria-hidden="true"></i>New chat with this folder</button>`;}
function placeProjectMenu(){const menu=q('#bw-project-menu');if(menu.hidden)return;const bounds=root.getBoundingClientRect(),anchor=q('#bw-folder-context').getBoundingClientRect();const left=Math.max(9,Math.min(anchor.left-bounds.left,root.clientWidth-menu.offsetWidth-9));const top=Math.max(9,Math.min(anchor.top-bounds.top-menu.offsetHeight-8,root.clientHeight-menu.offsetHeight-9));menu.style.left=left+'px';menu.style.top=top+'px';}
function renderProjectContext(){q('#bw-chat-title').textContent=ctx().title;q('#bw-folder-label').textContent=contextLabel();q('#bw-folder-context').setAttribute('aria-label','Agent working folder: '+contextLabel()+'. Open folder actions');q('#bw-prompt').value=ctx().draft||'';q('#bw-recent-chats').innerHTML=Object.entries(contexts).filter(([id])=>id!=='direct').map(([id,c])=>`<button class="bw-nav bw-recent-item ${current===id?'selected':''}" data-context="${id}"><span>${esc(c.title)}<small>${esc(contextLabel(c))}</small></span></button>`).join('');root.classList.toggle('editor-mode',!!ctx().editorExpanded&&active()?.type==='project');icons();}
const renderBeforeProject=render;
render=function(){renderBeforeProject();renderProjectContext();};
const chatBeforeProject=renderChat;
renderChat=function(){chatBeforeProject();if(ctx().isNew){const transcript=q('#bw-transcript');transcript.querySelector('.bw-user-message').textContent='Start a conversation with this working folder.';transcript.querySelector('.bw-agent-copy').textContent='I’ll work in '+contextLabel()+' for this conversation. Open the files beside our chat whenever you need them.';}else{q('.bw-agent-copy').textContent='I’m working in '+contextLabel()+'. The overview, website, and code review stay beside our conversation. You can also open the project files here.';}const entry=document.createElement('button');entry.className='bw-artifact';entry.dataset.projectOpen='';entry.innerHTML='<i data-lucide="folder-code" aria-hidden="true"></i><span><strong>Open project in editor</strong><small>'+esc(contextLabel())+'</small></span><span class="bw-spacer"></span><i data-lucide="arrow-up-right" aria-hidden="true"></i>';q('.bw-agent-copy').after(entry);icons();};
const positionBeforeProject=savePosition;
savePosition=function(){positionBeforeProject();ctx().draft=q('#bw-prompt').value;const t=active(),input=q('#bw-source-input');if(t?.type==='project'&&input){const state=fileState.get(t.file);state.selection=input.selectionStart;state.scroll=input.scrollTop;}};
const workBeforeProject=renderWork;
renderWork=function(){workBeforeProject();if(active()?.type==='project'){const state=fileState.get(active().file),input=q('#bw-source-input');input.setSelectionRange(Math.min(state.selection,state.draft.length),Math.min(state.selection,state.draft.length));input.scrollTop=state.scroll;}root.classList.toggle('editor-mode',!!ctx().editorExpanded&&active()?.type==='project');};
const menusBeforeProject=hideMenus;
hideMenus=function(){menusBeforeProject();q('#bw-project-menu').hidden=true;root.querySelectorAll('[data-project-menu]').forEach(b=>b.setAttribute('aria-expanded','false'));};
function openProject(expand=true){savePosition();pauseFollow();let t=ctx().tabs.find(t=>t.type==='project');if(!t){const suggested=Object.keys(exampleFiles).find(f=>!ctx().folder||f.startsWith(ctx().folder+'/'))||exampleFile;t=newTab('project',{title:'Project',projectId:ctx().projectId,folder:ctx().folder,file:suggested,treeOpen:expand});ctx().tabs.push(t);}t.treeOpen=expand;ctx().editorExpanded=expand;focusTab(t.id);}
function startFolderChat(folder){savePosition();pauseFollow();const source=active()?.type==='project'?active().file:null,id='folder-'+(++folderChatSerial);const tab=newTab('project',{title:'Project',projectId:ctx().projectId,folder,file:source||Object.keys(exampleFiles).find(f=>!folder||f.startsWith(folder+'/'))||exampleFile,treeOpen:false});contexts[id]={title:'Chat in '+(folder.split('/').at(-1)||project.folder),projectId:ctx().projectId,folder,tabs:[tab],active:tab.id,events:[],messages:[],following:false,running:false,chatScroll:0,closed:new Set(),draft:'',editorExpanded:false,isNew:true};current=id;mode='chat';hideMenus();root.classList.remove('mobile-chat');render();if(matchMedia('(max-width:570px)').matches)root.classList.add('mobile-chat');q('#bw-prompt').focus();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;const handle=()=>{e.stopImmediatePropagation();};if(b.hasAttribute('data-project-menu')){handle();const willOpen=q('#bw-project-menu').hidden;hideMenus();projectMenu();q('#bw-project-menu').hidden=!willOpen;placeProjectMenu();b.setAttribute('aria-expanded',String(willOpen));return;}if(b.hasAttribute('data-project-open')){handle();openProject(true);return;}if(d.new==='project'){handle();openProject(false);return;}if(b.hasAttribute('data-editor-expand')){handle();savePosition();ctx().editorExpanded=!ctx().editorExpanded;if(mode==='document'&&!ctx().editorExpanded){mode='chat';}active().treeOpen=ctx().editorExpanded;render();return;}if(b.hasAttribute('data-tree-toggle')){handle();savePosition();active().treeOpen=!active().treeOpen;renderWork();return;}if(d.projectFile){handle();savePosition();pauseFollow();active().file=d.projectFile;active().title=d.projectFile.split('/').at(-1);if(!ctx().editorExpanded)active().treeOpen=false;renderTabs();renderWork();return;}if(b.hasAttribute('data-chat-folder')){handle();startFolderChat(d.chatFolder);return;}if(b.hasAttribute('data-store-file')){handle();const state=fileState.get(active().file);state.saved=state.draft;q('#bw-file-status').textContent='Stored in demo · no disk changes';return;}},true);
root.addEventListener('input',e=>{if(e.target.id==='bw-source-input'){pauseFollow();const state=fileState.get(active().file);state.draft=e.target.value;state.selection=e.target.selectionStart;q('#bw-file-status').textContent=state.draft===state.saved?'Example files · session only':'Edited · not stored in demo';}if(e.target.id==='bw-prompt')ctx().draft=e.target.value;});
root.addEventListener('keydown',e=>{if(e.target.id==='bw-source-input'&&e.key==='Tab'){e.preventDefault();const input=e.target;input.setRangeText('  ',input.selectionStart,input.selectionEnd,'end');input.dispatchEvent(new Event('input',{bubbles:true}));}});

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.direct){contexts.direct.projectId=ctx().projectId;contexts.direct.folder=ctx().folder;}const event=b.dataset.event!==undefined?ctx().events[Number(b.dataset.event)]:b.id==='bw-latest'?ctx().events.at(-1):null;if(event?.type==='project'&&event.file){e.stopImmediatePropagation();openProject(false);active().file=event.file;active().title=event.file.split('/').at(-1);ctx().following=b.id==='bw-latest';render();}},true);
new ResizeObserver(placeProjectMenu).observe(root);
render();const design={chatWidth:60,theme:'System'};function applyDesign(){root.style.setProperty('--bw-chat',design.chatWidth+'fr');root.style.setProperty('--bw-work',(100-design.chatWidth)+'fr');root.style.colorScheme=design.theme==='System'?'light dark':design.theme.toLowerCase();}if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSlider(design,'chatWidth',{min:40,max:70,step:5,label:'Conversation width',unit:'%'});tweak.addSelect(design,'theme',{options:['System','Dark','Light'],label:'Appearance'});}
})();
</script>
</div>
