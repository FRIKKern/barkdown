name: Verify repository
on:
  # Local `npm run verify` is the authority (CYCLES: local authority). CI repeats it on pull
  # requests only; post-merge runs were a duplicate.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  concept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Ensure generated deliverables match source
        run: git diff --exit-code -- docs/PRD.md preview evidence/artifact-manifest.json
