name: Desktop suite
# The app's own test chain (app/package.json "test"). Local runs are the authority; CI exists for
# the signal a developer's machine cannot give. Pull requests that touch app/ run Windows and macOS;
# Linux runs weekly and on dispatch. Documentation and plan changes never trigger this. Artifact uploads are diagnostics and never fail a green run.
on:
  pull_request:
    paths: ['app/**', '.github/workflows/desktop.yml']
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      os:
        description: "One runner only (for example macos-latest); empty runs all three"
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Desktop suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Local runs are the authority (D-hosts, 2026-09-28). A pull request buys the Windows signal the Mac
      # cannot give, and the macOS runner's layout, the one the nightly release chain runs on (its checkout
      # and node sit under the runner's home folder); Linux runs weekly and on dispatch. The matrix is
      # chosen with fromJSON because expressions are not allowed inside exclude entries (the
      # earlier form was refused as a workflow-file error and no lane ran).
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest","advisory":false},{"os":"macos-latest","advisory":false}]' || (inputs.os != '' && format('[{{"os":"{0}","advisory":false}}]', inputs.os)) || '[{"os":"windows-latest","advisory":false},{"os":"ubuntu-latest","advisory":true},{"os":"macos-latest","advisory":true}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: npm 11 (the lockfiles are written by npm 11)
        run: npm install -g npm@11
      - name: Electron's shared libraries, Xvfb and Secret Service (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libgtk-3-0 || sudo apt-get install -y -q xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2 libgtk-3-0
          sudo apt-get install -y -q dbus-daemon gnome-keyring libsecret-tools
      - name: Install (root holds playwright; app holds electron and the app's deps)
        shell: bash
        # Some chain segments drive a Playwright Chromium beside Electron; the runner has none.
        run: |
          npm ci
          if [ "$RUNNER_OS" = Linux ]; then npx playwright install --with-deps chromium; else npx playwright install chromium; fi
          cd app && npm ci && npx install-electron --no
      - name: A screen the window tours fit on (macOS only)
        if: runner.os == 'macOS'
        # The hosted Mac's display is shorter than the 760-900 px windows several tours ask for, and
        # macOS keeps a window on screen. Prefer a 1920x1080 mode when the virtual display offers one.
        run: |
          system_profiler SPDisplaysDataType | grep -E 'Resolution|UI Looks like' || true
          brew install --quiet jakehilborn/jakehilborn/displayplacer || true
          if command -v displayplacer >/dev/null; then
            displayplacer list | grep -E 'Persistent screen id|res:1920x1080' | head -6 || true
            id=$(displayplacer list | awk '/Persistent screen id:/{print $4; exit}')
            displayplacer "id:$id res:1920x1080 scaling:off origin:(0,0) degree:0" || true
          fi
          system_profiler SPDisplaysDataType | grep -E 'Resolution|UI Looks like' || true
          # Unattended, as the local nightly is: test windows come to the front, Chromium's mock keychain.
          { echo BARKDOWN_TEST_FOREGROUND=1; echo BARKDOWN_MOCK_KEYCHAIN=1; } >> "$GITHUB_ENV"
      - name: Windows contained-launch preflight
        if: runner.os == 'Windows'
        shell: bash
        # C098 startup investigation: fail before costly Electron journeys and retain
        # phase diagnostics through the existing artifact step. The full chain stays.
        run: node --test app/tests/windows-system-tools.test.mjs
      - name: Build and test (Linux under Xvfb)
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          # The synthetic credentials must survive Electron crashes in a real Secret Service session.
          keyring_root=$(mktemp -d "$RUNNER_TEMP/barkdown-keyring.XXXXXXXX")
          export XDG_DATA_HOME="$keyring_root/data" XDG_RUNTIME_DIR="$keyring_root/run"
          install -d -m 700 "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          unset GNOME_KEYRING_CONTROL
          xvfb-run -a --server-args="-screen 0 1600x1000x24" dbus-run-session -- bash -euo pipefail -s <<'BARKDOWN_CI'
            printf %s barkdown-ci-fixture | timeout 15s gnome-keyring-daemon --unlock --components=secrets
            printf %s barkdown-ci-probe | timeout 15s secret-tool store --label="Barkdown CI probe" barkdown-ci probe
            test "$(timeout 15s secret-tool lookup barkdown-ci probe)" = barkdown-ci-probe
            echo "Disposable Secret Service round trip passed"
            exec npm run test:desktop </dev/null
          BARKDOWN_CI
      - name: Build and test
        if: runner.os != 'Linux'
        shell: bash
        # macOS runners hand out a symlinked temp dir (/var -> /private/var); the app's store
        # refuses to traverse links, so tests get the real path (same rule as CYCLES hosts notes).
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            resolved_tmpdir=$(node -e 'console.log(require("fs").realpathSync(require("os").tmpdir()))')
            export TMPDIR="$resolved_tmpdir"
          fi
          npm run test:desktop
      - name: Packaged build keeps the CLI fence (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # Unsigned, unpublished and thrown away: the app's own build config packed with --dir, then its
        # document server child run against a stand-in CLI, inside the bundle and copied out of it.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          start=$(date +%s)
          out="$RUNNER_TEMP/barkdown-packaged"
          cd app
          npx electron-builder --win --x64 --dir --publish never -c.directories.output="$out" -c.win.signExecutable=false
          node tests/packaged-cli-fence.mjs "$out/win-unpacked"
          # The probe returns only after its children exit, so nothing holds the folder: one removal, and a folder
          # still there afterwards fails the step at once, by name.
          if ! rm -rf "$out" || [ -e "$out" ]; then echo "Could not remove $out: something still holds it"; exit 1; fi
          echo "Packaged fence step: $(( $(date +%s) - start )) s"
      - uses: actions/upload-artifact@v4
        # Diagnostics only: a full artifact store (the account quota) must not fail a green suite.
        if: always()
        continue-on-error: true
        with:
          name: desktop-results-${{ matrix.os }}
          path: |
            app/test-results/
          if-no-files-found: ignore
          retention-days: 3
