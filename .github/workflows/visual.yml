name: Visual candidates
on:
  # Capture, compare and approval are local steps with immutable review files in the repo; the
  # hosted candidate bundle is on demand only (local authority, 2026-09-28).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix app ci
      - name: Record the artifact boundary
        id: bundle_start
        run: node scripts/ci-review-bundle.mjs prepare "$env:RUNNER_TEMP/barkdown-visual-review"
      - run: npm run visual:capture
        id: capture
      - run: npm run visual:compare
        id: compare
      - name: Package current review or failure diagnostics
        if: always() && steps.bundle_start.outcome == 'success'
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: node scripts/ci-review-bundle.mjs pack "$env:RUNNER_TEMP/barkdown-visual-review"
      # CI only publishes candidates. It cannot approve or update baselines.
      - uses: actions/upload-artifact@v4
        if: always() && steps.bundle_start.outcome == 'success'
        with:
          name: visual-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/barkdown-visual-review/artifact
          if-no-files-found: error
          retention-days: 7
