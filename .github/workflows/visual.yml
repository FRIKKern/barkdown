name: Visual candidates
on:
  pull_request:
    paths: ['app/**', 'scripts/visual*', 'docs/visual/**', 'package*.json', '.github/workflows/visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix app ci
      - run: npm run visual:capture
      - run: npm run visual:compare
      # CI only publishes candidates. It cannot approve or update baselines.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-candidate-${{ github.sha }}
          path: |
            docs/visual/runs/
            docs/visual/pending.json
          if-no-files-found: error
