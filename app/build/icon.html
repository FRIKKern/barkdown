<!doctype html>
<!-- The drawing scripts/app-icon.mjs renders. Apple's macOS icon grid: an 824 px rounded square centred on a
     1024 px canvas, corner radius 185, a soft shadow below it. Colors are the app's moss (--bw-accent) and paper. -->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
  .tile { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
    background: linear-gradient(180deg, #5c8340 0%, #46662b 55%, #3a5723 100%);
    box-shadow: 0 10px 20px rgba(0, 0, 0, .28), inset 0 2px 0 rgba(255, 255, 255, .18), inset 0 -3px 0 rgba(0, 0, 0, .18); }
  .b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 640px/1 "Schibsted Grotesk", sans-serif;
    color: #fffdf8; letter-spacing: 0; padding-bottom: 46px; padding-left: 8px; text-shadow: 0 6px 14px rgba(0, 0, 0, .22); }
</style>
<div class="tile"><div class="b">b</div></div>
