<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1130" viewBox="0 0 1760 1130" role="img" aria-labelledby="title desc">
<title id="title">Barkdown roadmap — demonstrated, in progress and remaining</title>
<desc id="desc">Profiles: ACCEPTED. Separate notes and chats: Demonstrated; Owned media and keys: Demonstrated; Restore tabs and drafts: Demonstrated; Keep agent runs isolated: Demonstrated; Switch profiles safely: Demonstrated. Installation: BLOCKED. Install without a checkout: In progress; Update without losing work: In progress; Recover a failed upgrade: Remaining; Keep data on uninstall: Remaining; Keyboard, zoom, a real terminal: In progress. Paper notes: BUILDING NOW. Create, edit and search: Demonstrated; Agent edits and safe Undo: Demonstrated; Recover deleted notes: Demonstrated; Read original history: Demonstrated; Migrate with a way back: In progress. Recovery &amp; portability: UP NEXT. Save and draft recovery: Demonstrated; Export notes and media: Demonstrated; Include chats and links: Demonstrated; Import into a fresh profile: Demonstrated; Continue on another device: In progress. Cloud sync: LATER. Work offline, sync later: Remaining; Reconcile device edits: Remaining; Resolve edit/delete overlap: Remaining; Respect access changes: Remaining; Keep sync optional: Remaining. The agent’s browser: BUILDING NOW. Your sessions, signed in: In progress; Claude and Codex use your tabs: In progress; Pauses on sensitive actions: In progress; Bench vs the two desktops: In progress; A day without Chrome: Remaining. Checkmarks describe bounded demonstrated journeys, not completion of the whole stage. Profiles are accepted for the Windows source prototype.</desc>
