<text x="65" y="124" font-size="20" fill="#afbcaa" font-weight="400">A Barkpark Native App Experiment</text>
<text x="1374" y="77" text-anchor="end" font-size="12" font-weight="600" letter-spacing="3" fill="#a3b49b">THE ROAD AHEAD</text>
<text x="65" y="174" font-size="16" fill="#c2dca1" font-weight="400">✓  Demonstrated</text>
