<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
<title id="title">Barkdown roadmap — demonstrated, in progress and remaining</title>
<desc id="desc">Profiles: ACCEPTED. Separate notes and chats: Demonstrated; Owned media and keys: Demonstrated; Restore tabs and drafts: Demonstrated; Keep agent runs isolated: Demonstrated; Switch profiles safely: Demonstrated. Paper notes: BUILDING NOW. Create, edit and search: Demonstrated; Agent edits and safe Undo: Demonstrated; Recover deleted notes: Demonstrated; Read original history: Demonstrated; Migrate with a way back: In progress. Recovery &amp; portability: UP NEXT. Save and draft recovery: In progress; Export notes and media: Remaining; Include chats and links: Remaining; Import into a fresh profile: Remaining; Continue on another device: Remaining. Cloud sync: LATER. Work offline, sync later: Remaining; Reconcile device edits: Remaining; Resolve edit/delete overlap: Remaining; Respect access changes: Remaining; Keep sync optional: Remaining. Installation: LATER. Install without a checkout: Remaining; Update without losing work: Remaining; Recover a failed upgrade: Remaining; Keep data on uninstall: Remaining; Keyboard, zoom, daily use: Remaining. Checkmarks describe bounded demonstrated journeys, not completion of the whole stage. Profiles are accepted for the Windows source prototype.</desc>
<defs>
  <radialGradient id="background" cx="28%" cy="0%" r="95%"><stop stop-color="#243025"/><stop offset="1" stop-color="#111915"/></radialGradient>
  <linearGradient id="focus" x2="0" y2="1"><stop stop-color="#a9c787" stop-opacity=".09"/><stop offset="1" stop-color="#a9c787" stop-opacity="0"/></linearGradient>
</defs>
