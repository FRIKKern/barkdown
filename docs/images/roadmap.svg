<path d="M64 624H1376" stroke="#344435"/>
<text x="64" y="663" font-size="12" fill="#c2dca1" font-weight="600">NOW</text>
<text x="125" y="663" font-size="17" fill="#d4ddce" font-weight="400">Make migration safe to enter, cancel and recover. Current preparation work is not merged.</text>
<text x="64" y="701" font-size="12" fill="#a3b49b" font-weight="600">NEXT</text>
<text x="125" y="701" font-size="17" fill="#b6c1af" font-weight="400">Compare the whole library → prove cutover and rollback → retire the old editor.</text>
<text x="64" y="748" font-size="15" fill="#a3b49b" font-weight="400">Read the linked checklist for evidence and limits. After recovery, sync and local installation can move independently.</text>
