<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
<title id="title">Barkdown roadmap</title>
<desc id="desc">Profile ownership and isolation: done; depends on the existing runtime. Every note on Paper: active; depends on P1. Recovery and portable profiles: todo; depends on P2. Optional two-way cloud sync: todo; depends on P3. Ordinary installation and daily-use pilot: todo; depends on P3.</desc>
<defs>
  <radialGradient id="background" cx="28%" cy="0%" r="95%"><stop stop-color="#243025"/><stop offset="1" stop-color="#111915"/></radialGradient>
  <linearGradient id="focus" x2="0" y2="1"><stop stop-color="#a9c787" stop-opacity=".09"/><stop offset="1" stop-color="#a9c787" stop-opacity="0"/></linearGradient>
</defs>
<g font-family="Segoe UI, Arial, sans-serif">
<rect width="1440" height="660" rx="14" fill="url(#background)"/>
<text x="64" y="87" font-family="Georgia, serif" font-size="49" letter-spacing="-1.5" fill="#f0eee2">Barkdown</text>
<text x="65" y="127" font-size="20" fill="#afbcaa" font-weight="400">A Barkpark Native App Experiment</text>
<text x="1374" y="79" text-anchor="end" font-size="12" font-weight="600" letter-spacing="3" fill="#a3b49b">THE ROAD AHEAD</text>
<path d="M70 208H1158" stroke="#475747" stroke-width="1"/>
<g data-phase="P1">
<circle cx="70" cy="208" r="6" fill="#859e70"/>
<text x="64" y="252" font-size="12" letter-spacing="1.5" font-weight="600" fill="#a3b49b">COMPLETE</text>
<text x="64" y="300" dy="0" font-family="Georgia, serif" font-size="29" letter-spacing="-.4" fill="#e2e6da">Profiles</text>
<text x="64" y="374" font-size="17" fill="#b6c1af" font-weight="400">Separate notes and chats</text>
<text x="64" y="409" font-size="17" fill="#b6c1af" font-weight="400">Profile-owned media and keys</text>
<text x="64" y="444" font-size="17" fill="#b6c1af" font-weight="400">Restore tabs, drafts &amp; favorites</text>
<text x="64" y="479" font-size="17" fill="#b6c1af" font-weight="400">Keep agent runs isolated</text>
<text x="64" y="514" font-size="17" fill="#b6c1af" font-weight="400">Switch profiles safely</text>
</g>
<g data-phase="P2">
<rect x="318" y="177" width="250" height="400" rx="8" fill="url(#focus)"/><circle cx="342" cy="208" r="14" fill="#1e2a20" stroke="#728c5d"/><circle cx="342" cy="208" r="5" fill="#c2dca1"/>
<text x="336" y="252" font-size="12" letter-spacing="1.5" font-weight="600" fill="#c2dca1">BUILDING NOW</text>
<text x="336" y="300" dy="0" font-family="Georgia, serif" font-size="29" letter-spacing="-.4" fill="#f0f0dc">Paper notes</text>
<text x="336" y="374" font-size="17" fill="#b6c1af" font-weight="400">Create, edit and search</text>
<text x="336" y="409" font-size="17" fill="#b6c1af" font-weight="400">Agents use the same editor</text>
<text x="336" y="444" font-size="17" fill="#b6c1af" font-weight="400">Undo without losing edits</text>
<text x="336" y="479" font-size="17" fill="#b6c1af" font-weight="400">Preserve links and media</text>
<text x="336" y="514" font-size="17" fill="#b6c1af" font-weight="400">Migrate with a way back</text>
</g>
<g data-phase="P3">
<circle cx="614" cy="208" r="5" fill="#17201a" stroke="#73836c" stroke-width="1.5"/>
<text x="608" y="252" font-size="12" letter-spacing="1.5" font-weight="600" fill="#a3b49b">UP NEXT</text>
<text x="608" y="300" dy="0" font-family="Georgia, serif" font-size="29" letter-spacing="-.4" fill="#e2e6da">Recovery &amp;</text>
<text x="608" y="300" dy="33" font-family="Georgia, serif" font-size="29" letter-spacing="-.4" fill="#e2e6da">portability</text>
<text x="608" y="374" font-size="17" fill="#b6c1af" font-weight="400">Recover interrupted saves</text>
<text x="608" y="409" font-size="17" fill="#b6c1af" font-weight="400">Keep drafts through restart</text>
<text x="608" y="444" font-size="17" fill="#b6c1af" font-weight="400">Export notes, media &amp; chats</text>
<text x="608" y="479" font-size="17" fill="#b6c1af" font-weight="400">Import into a fresh profile</text>
<text x="608" y="514" font-size="17" fill="#b6c1af" font-weight="400">Continue on another device</text>
</g>
<g data-phase="P4">
<circle cx="886" cy="208" r="5" fill="#17201a" stroke="#73836c" stroke-width="1.5"/>
<text x="880" y="252" font-size="12" letter-spacing="1.5" font-weight="600" fill="#a3b49b">LATER</text>
<text x="880" y="300" dy="0" font-family="Georgia, serif" font-size="29" letter-spacing="-.4" fill="#e2e6da">Cloud sync</text>
<text x="880" y="374" font-size="17" fill="#b6c1af" font-weight="400">Work offline, sync later</text>
<text x="880" y="409" font-size="17" fill="#b6c1af" font-weight="400">Reconcile edits across devices</text>
<text x="880" y="444" font-size="17" fill="#b6c1af" font-weight="400">Handle edit/delete conflicts</text>
<text x="880" y="479" font-size="17" fill="#b6c1af" font-weight="400">Respect access changes</text>
<text x="880" y="514" font-size="17" fill="#b6c1af" font-weight="400">Keep cloud optional</text>
</g>
<g data-phase="P5">
<circle cx="1158" cy="208" r="5" fill="#17201a" stroke="#73836c" stroke-width="1.5"/>
<text x="1152" y="252" font-size="12" letter-spacing="1.5" font-weight="600" fill="#a3b49b">LATER</text>
<text x="1152" y="300" dy="0" font-family="Georgia, serif" font-size="29" letter-spacing="-.4" fill="#e2e6da">Installation</text>
<text x="1152" y="374" font-size="17" fill="#b6c1af" font-weight="400">Install without a checkout</text>
<text x="1152" y="409" font-size="17" fill="#b6c1af" font-weight="400">Update without losing work</text>
<text x="1152" y="444" font-size="17" fill="#b6c1af" font-weight="400">Recover a failed upgrade</text>
<text x="1152" y="479" font-size="17" fill="#b6c1af" font-weight="400">Keep data when uninstalling</text>
<text x="1152" y="514" font-size="17" fill="#b6c1af" font-weight="400">Keyboard, zoom &amp; daily use</text>
</g>
<path d="M64 591H1376" stroke="#344435"/>
<text x="64" y="629" font-size="16" fill="#a3b49b" font-weight="400">After recovery, optional sync and local installation can move forward independently.</text>
</g></svg>
