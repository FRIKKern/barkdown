<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
<title id="title">Barkdown delivery roadmap</title>
<desc id="desc">P1: Profile ownership and isolation, done, depends on existing runtime. P2: Every note on Paper, active, depends on P1. P3: Recovery and portable profiles, todo, depends on P2. P4: Optional two-way cloud sync, todo, depends on P3. P5: Ordinary installation and daily-use pilot, todo, depends on P3. Phases are acceptance gates, not dates. C067: Create, edit, find and reopen ordinary owned notes in real Paper.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#20271e"/><stop offset="1" stop-color="#111813"/></linearGradient><linearGradient id="active" x2="0" y2="1"><stop stop-color="#34432a"/><stop offset="1" stop-color="#222d20"/></linearGradient><linearGradient id="band"><stop stop-color="#7b9656"/><stop offset=".4" stop-color="#bcda82"/><stop offset="1" stop-color="#4c6050"/></linearGradient></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect width="1600" height="1030" rx="24" fill="url(#bg)"/>
<path d="M1100 0L1600 350M1260 0L1600 220M1380 0L1600 140" stroke="#a6c775" stroke-opacity=".06" stroke-width="80"/>
<text x="58" y="60" font-size="17" fill="#b7cf94" font-weight="600" >B A R K D O W N   /   D E L I V E R Y   M A P</text>
<text x="58" y="124" font-size="38" fill="#f0f1e9" font-weight="650" >From a working prototype to a dependable workspace.</text>
<text x="58" y="168" font-size="22" fill="#abb7a4" font-weight="400" >One clear journey at a time. Each phase advances when its evidence passes.</text>
<rect x="1266" y="38" width="278" height="36" rx="18" fill="#303d28"/>
<text x="1405" y="62" font-size="16" fill="#d2e6ad" font-weight="700" text-anchor="middle">WORKING ON P2</text>
