<text x="80" y="255" font-size="14" fill="#afc58d" font-weight="700" letter-spacing="2">ACCEPTED</text>
<text x="80" y="299" font-size="24" fill="#f0f1e9" font-weight="650" >Profile ownership</text><text x="80" y="329" font-size="24" fill="#f0f1e9" font-weight="650" >and isolation</text>
<rect x="58" y="393" width="282" height="44" fill="#718452"/>
<text x="80" y="422" font-size="22" fill="#e4ecd9" font-weight="700" >P1</text>
<text x="131" y="420" font-size="13" fill="#d3deca" font-weight="600" letter-spacing="1">FOUNDATION</text>
<text x="80" y="474" font-size="18" fill="#e0e5da" font-weight="400" >Owned profiles</text>
<text x="80" y="506" font-size="18" fill="#e0e5da" font-weight="400" >Separate notes and chats</text>
<text x="80" y="538" font-size="18" fill="#e0e5da" font-weight="400" >Safe profile switching</text>
<path d="M80 564H318" stroke="#4c5a45"/>
<text x="80" y="596" font-size="16" fill="#a9b89c" font-weight="400" >Accepted Windows</text><text x="80" y="620" font-size="16" fill="#a9b89c" font-weight="400" >source prototype</text>
<text x="80" y="688" font-size="16" fill="#9faa95" font-weight="400" >Built on the existing runtime</text>
<rect x="358" y="222" width="282" height="434" rx="12" fill="url(#active)" stroke="#9ebd72" stroke-width="2"/>
<text x="380" y="255" font-size="14" fill="#d0e7a5" font-weight="700" letter-spacing="2">WORKING HERE</text>
<text x="380" y="299" font-size="24" fill="#f0f1e9" font-weight="650" >Every note on Paper</text>
