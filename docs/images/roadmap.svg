<text x="58" y="754" font-size="19" fill="#c2ceae" font-weight="400" >P4 and P5 branch after P3. Local installation does not have to wait for cloud sync.</text>
<rect x="58" y="792" width="1484" height="124" rx="12" fill="#273223" stroke="#4b5d3e"/>
<text x="80" y="826" font-size="14" fill="#bed59b" font-weight="700" letter-spacing="1.5">CURRENT CYCLE  /  C067  ·  ACTIVE</text>
<text x="80" y="861" font-size="21" fill="#edf0e5" font-weight="500" >Create, edit, find and reopen ordinary owned notes in real Paper.</text>
<text x="58" y="958" font-size="17" fill="#aebaa4" font-weight="400" >Phases, not release dates. Status comes from docs/plan.json; the current cycle comes from docs/cycle.json.</text>
<text x="58" y="993" font-size="17" fill="#aebaa4" font-weight="400" >Separate release gates: G1 blocked · G2 blocked. An accepted phase is not a production release.</text>
