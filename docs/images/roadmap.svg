<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
<title id="title">Barkdown roadmap</title>
<desc id="desc">Profile ownership and isolation: done; depends on the existing runtime. Every note on Paper: active; depends on P1. Recovery and portable profiles: todo; depends on P2. Optional two-way cloud sync: todo; depends on P3. Ordinary installation and daily-use pilot: todo; depends on P3.</desc>
<g font-family="Segoe UI, Arial, sans-serif">
<rect width="1280" height="340" rx="18" fill="#171d17"/>
<text x="40" y="60" font-size="30" fill="#edf0e5" font-weight="650">Barkdown</text>
<text x="1090" y="57" font-size="15" fill="#a5b298" font-weight="600">ROADMAP</text>
<rect x="40" y="98" width="224" height="172" rx="10" fill="#202820" />
<text x="58" y="133" font-size="15" fill="#a5b298" font-weight="600">Done</text>
<text x="58" y="185" font-size="24" fill="#edf0e5" font-weight="600">Profiles</text>
<text x="58" y="220" font-size="16" fill="#b8c2af" font-weight="400">Your own workspace</text>
<rect x="284" y="98" width="224" height="172" rx="10" fill="#2c3923" stroke="#a9ca7b"/>
<text x="302" y="133" font-size="15" fill="#c9e49e" font-weight="600">Now</text>
<text x="302" y="185" font-size="24" fill="#edf0e5" font-weight="600">Paper notes</text>
<text x="302" y="220" font-size="16" fill="#b8c2af" font-weight="400">One editor for every note</text>
<rect x="528" y="98" width="224" height="172" rx="10" fill="#202820" />
<text x="546" y="133" font-size="15" fill="#a5b298" font-weight="600">Later</text>
<text x="546" y="185" font-size="24" fill="#edf0e5" font-weight="600">Recovery</text>
<text x="546" y="220" font-size="16" fill="#b8c2af" font-weight="400">Restore. Export. Continue.</text>
<rect x="772" y="98" width="224" height="172" rx="10" fill="#202820" />
<text x="790" y="133" font-size="15" fill="#a5b298" font-weight="600">Later</text>
<text x="790" y="185" font-size="24" fill="#edf0e5" font-weight="600">Cloud sync</text>
<text x="790" y="220" font-size="16" fill="#b8c2af" font-weight="400">Optional. Offline first.</text>
<rect x="1016" y="98" width="224" height="172" rx="10" fill="#202820" />
<text x="1034" y="133" font-size="15" fill="#a5b298" font-weight="600">Later</text>
<text x="1034" y="185" font-size="24" fill="#edf0e5" font-weight="600">Installation</text>
<text x="1034" y="220" font-size="16" fill="#b8c2af" font-weight="400">Install and start writing</text>
<text x="40" y="313" font-size="15" fill="#a5b298" font-weight="400">After recovery: optional sync and installation.</text>
</g></svg>
