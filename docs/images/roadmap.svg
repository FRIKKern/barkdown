<text x="1280" y="299" font-size="24" fill="#f0f1e9" font-weight="650" >Ordinary</text><text x="1280" y="329" font-size="24" fill="#f0f1e9" font-weight="650" >installation and</text><text x="1280" y="359" font-size="24" fill="#f0f1e9" font-weight="650" >daily-use pilot</text>
<rect x="1258" y="393" width="282" height="44" fill="#344638"/>
<text x="1280" y="422" font-size="22" fill="#e4ecd9" font-weight="700" >P5</text>
<text x="1331" y="420" font-size="13" fill="#d3deca" font-weight="600" letter-spacing="1">NEXT MILESTONE</text>
<text x="1280" y="474" font-size="18" fill="#e0e5da" font-weight="400" >Install without a toolchain</text>
<text x="1280" y="506" font-size="18" fill="#e0e5da" font-weight="400" >Update without losing data</text>
<text x="1280" y="538" font-size="18" fill="#e0e5da" font-weight="400" >Prove everyday use</text>
<path d="M1280 564H1518" stroke="#4c5a45"/>
<text x="1280" y="596" font-size="16" fill="#a9b89c" font-weight="400" >Local pilot follows P3</text><text x="1280" y="620" font-size="16" fill="#a9b89c" font-weight="400" >Cloud pilot also needs P4</text>
<text x="1280" y="688" font-size="16" fill="#9faa95" font-weight="400" >Depends on P3</text>
