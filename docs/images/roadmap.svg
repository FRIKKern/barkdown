<text x="980" y="538" font-size="18" fill="#e0e5da" font-weight="400" >Resolve overlapping changes</text>
<path d="M980 564H1218" stroke="#4c5a45"/>
<text x="980" y="596" font-size="16" fill="#a9b89c" font-weight="400" >Optional cloud path</text><text x="980" y="620" font-size="16" fill="#a9b89c" font-weight="400" >after recovery</text>
<text x="980" y="688" font-size="16" fill="#9faa95" font-weight="400" >Depends on P3</text>
<rect x="1258" y="222" width="282" height="434" rx="12" fill="#202921" stroke="#384437" stroke-width="1"/>
